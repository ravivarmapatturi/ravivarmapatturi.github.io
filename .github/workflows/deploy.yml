name: Deploy portfolio

# Builds the Astro site and publishes dist/ to the gh-pages branch, which is
# what GitHub Pages serves for this repository (Settings > Pages > gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site with Astro
        run: npm run build
      - name: Keep GitHub Pages from running Jekyll on the output
        run: touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
